<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수행평가 통합 관리 시스템</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e293b; --accent: #3b82f6; --bg: #f8fafc;
            --card: #ffffff; --border: #e2e8f0; --text: #334155;
            --teacher-color: #10b981; 
        }

        body {
            font-family: 'Pretendard', sans-serif; background-color: var(--bg);
            color: var(--text); margin: 0; display: flex; justify-content: center; min-height: 100vh;
        }

        /* 로그인 화면 */
        .login-container {
            width: 100%; max-width: 440px; background: var(--card); padding: 40px;
            border-radius: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.05), 0 10px 10px -5px rgba(0,0,0,0.04);
            align-self: center; border: 1px solid var(--border);
        }
        
        .login-tabs { display: flex; gap: 10px; margin-bottom: 25px; }
        .tab-btn {
            flex: 1; padding: 12px; border: none; border-radius: 12px; font-size: 1.05rem;
            font-weight: bold; cursor: pointer; background: #f1f5f9; color: #94a3b8; transition: 0.2s;
        }
        .tab-btn.active.student { background: var(--accent); color: white; }
        .tab-btn.active.teacher { background: var(--teacher-color); color: white; }

        .login-input {
            width: 100%; padding: 14px; margin-bottom: 15px; border: 2px solid var(--border);
            border-radius: 12px; font-size: 1.1rem; font-family: inherit; font-weight: 600;
            box-sizing: border-box; transition: 0.2s; text-align: center;
        }
        .login-input:focus { border-color: var(--accent); outline: none; background: #fff; }
        
        .login-btn {
            width: 100%; padding: 14px; color: white; border: none; border-radius: 12px; 
            font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-student { background: var(--accent); }
        .btn-student:hover { background: #2563eb; }
        .btn-teacher { background: var(--teacher-color); }
        .btn-teacher:hover { background: #059669; }

        /* 메인 대시보드 레이아웃 */
        .app-wrapper {
            display: none; width: 100%; max-width: 1400px; padding: 40px 20px;
            gap: 30px; grid-template-columns: 1.4fr 1.6fr; box-sizing: border-box;
        }

        .calendar-section, .info-section {
            background: var(--card); border-radius: 24px; padding: 30px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03); border: 1px solid var(--border);
            box-sizing: border-box;
        }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; gap: 10px; }
        .calendar-nav { display: flex; align-items: center; gap: 15px; }
        .calendar-nav h1 { font-size: 1.4rem; margin: 0; color: var(--primary); }
        .nav-btn { background: #f1f5f9; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: inherit; }
        .nav-btn:hover { background: #e2e8f0; }

        .role-badge { padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; background: #eff6ff; color: var(--accent); }

        /* 학급 선택 드롭다운 스타일 */
        .top-select {
            padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px;
            font-size: 1rem; font-weight: 700; color: var(--primary); background: #f8fafc;
            cursor: pointer; font-family: inherit; outline: none;
        }
        .top-select:focus { border-color: var(--teacher-color); background: white; }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
        .day-name { text-align: center; font-weight: 600; font-size: 0.85rem; color: #94a3b8; padding-bottom: 8px; }
        .day {
            background: #fff; border: 1px solid var(--border); min-height: 100px;
            padding: 8px; border-radius: 12px; cursor: pointer; transition: 0.2s;
            display: flex; flex-direction: column; gap: 4px; box-sizing: border-box; overflow: hidden;
        }
        .day:hover { border-color: var(--accent); background: #f8fafc; }
        .day.today { border: 2px solid var(--accent); background: #eff6ff; }
        .day-number { font-weight: 700; font-size: 0.9rem; margin-bottom: 2px; display: block; }

        .event-item {
            background: var(--accent); color: white; border-radius: 6px;
            padding: 4px 8px; font-size: 0.75rem; font-weight: 600;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            width: 100%; box-sizing: border-box; display: block;
        }
        .event-item.selected { background: var(--primary); outline: 2px solid var(--accent); }

        .info-section { position: sticky; top: 40px; height: fit-content; display: flex; flex-direction: column; gap: 18px; }
        .info-placeholder { color: #94a3b8; text-align: center; padding: 150px 0; font-size: 1.05rem; line-height: 1.6; }
        
        .info-header { border-bottom: 2px solid var(--bg); padding-bottom: 15px; margin-bottom: 5px; }
        .info-header h2 { margin: 0; font-size: 1.5rem; color: var(--primary); word-break: break-all; }
        
        .memo-area {
            width: 100%; height: 200px; border: 1px solid var(--border); border-radius: 14px;
            padding: 18px; font-family: inherit; font-size: 1rem; line-height: 1.6; resize: vertical;
            background: #f8fafc; box-sizing: border-box; color: #1e293b; transition: 0.2s;
        }
        .memo-area:focus { background: #fff; border-color: var(--accent); outline: none; }
        .memo-area:disabled { background: #f1f5f9; color: #64748b; cursor: not-allowed; }

        /* 📸 사진 갤러리 영역 스타일 (복구 및 유지) */
        .image-gallery-container {
            border: 1px dashed var(--border); border-radius: 14px; padding: 15px;
            background: #f8fafc; min-height: 120px; box-sizing: border-box;
        }
        .image-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; margin-top: 5px;
        }
        .image-wrapper {
            position: relative; aspect-ratio: 1 / 1; border-radius: 8px; overflow: hidden;
            border: 1px solid var(--border); background: #fff; display: flex; justify-content: center; align-items: center;
        }
        .image-wrapper img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
        
        /* ✕ 사진 개별 삭제 버튼 */
        .img-delete-btn {
            position: absolute; top: 4px; right: 4px; background: rgba(239, 68, 68, 0.9);
            color: white; border: none; border-radius: 5px; width: 22px; height: 22px;
            font-size: 11px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center;
            z-index: 10; display: none; /* 기본적으로 숨김 */
        }
        /* 수정 권한이 있을 때만 삭제 버튼 노출 */
        .has-edit-auth .img-delete-btn { display: flex; }

        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; }
        .btn {
            flex: 1; padding: 12px; border: none; border-radius: 10px;
            font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 0.9rem;
        }
        .btn-save { background: var(--accent); color: white; }
        .btn-save:hover { background: #2563eb; }
        .btn-delete { background: #fee2e2; color: #ef4444; }
        .btn-delete:hover { background: #fecaca; }
        .btn-upload { background: #f1f5f9; color: var(--text); border: 1px solid var(--border); text-align: center; display: block; cursor: pointer; padding: 12px; border-radius: 10px; font-weight: 600; font-size: 0.9rem; flex: 1;}
        .btn-upload:hover { background: #e2e8f0; }

        /* 권한 제어용 클래스 */
        .edit-only { display: none; } /* 임원/교사 공통 편집 */
        .admin-only { display: none; } /* 오직 교사(초기화) */

        #fileInput { display: none; }

        @media (max-width: 1024px) {
            .app-wrapper { grid-template-columns: 1fr; }
            .info-section { position: static; }
        }
    </style>
</head>
<body>

<div class="login-container" id="loginScreen">
    <h2 style="font-size:1.6rem; margin-bottom:20px; text-align:center;">🎓 수행평가 통합 시스템</h2>
    
    <div class="login-tabs">
        <button class="tab-btn active student" id="tabStudent" onclick="switchTab('student')">학생 로그인</button>
        <button class="tab-btn" id="tabTeacher" onclick="switchTab('teacher')">교사 로그인</button>
    </div>

    <div id="studentForm">
        <input type="text" id="studentIdInput" class="login-input" placeholder="학번 5자리 입력 (예: 10312)" maxlength="5">
        <input type="password" id="managerCodeInput" class="login-input" placeholder="임원 인증 코드 (일반 학생 생략)" maxlength="4">
        <button class="login-btn btn-student" onclick="loginStudent()">조회하기</button>
    </div>

    <div id="teacherForm" style="display: none;">
        <input type="password" id="teacherPwInput" class="login-input" placeholder="교사 비밀번호 입력" style="letter-spacing: 2px;">
        <button class="login-btn btn-teacher" onclick="loginTeacher()">관리자로 입장</button>
        <p style="font-size:0.75rem; color:#94a3b8; margin-top:10px; text-align:center;">초기 비밀번호: admin</p>
    </div>
</div>

<div class="app-wrapper" id="mainApp">
    <div class="calendar-section">
        <div class="top-bar">
            <div class="calendar-nav">
                <button class="nav-btn" onclick="changeMonth(-1)">◀</button>
                <h1 id="monthYear">2026년 6월</h1>
                <button class="nav-btn" onclick="changeMonth(1)">▶</button>
            </div>
            
            <div style="display: flex; align-items: center; gap: 10px;">
                <div id="classDisplayArea" style="display: flex; gap: 6px; align-items: center;"></div>
                <div id="userRoleBadge" class="role-badge">학생</div>
            </div>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
        
        <div style="margin-top:20px; display: flex; justify-content: space-between; align-items: center;">
            <div><button class="admin-only" onclick="resetAllData()" style="background:none; border:none; color:#ef4444; cursor:pointer; font-size:0.8rem; font-weight: bold;">⚠️ 반 전체 일정 초기화</button></div>
            <button onclick="location.reload()" style="background:none; border:none; color:#94a3b8; cursor:pointer; font-size:0.8rem; font-weight: bold;">🔄 로그아웃</button>
        </div>
    </div>

    <div class="info-section" id="infoSection">
        <div class="info-placeholder" id="placeholder">
            <p>📅 달력의 날짜나<br>수행평가 항목을 선택하세요.</p>
        </div>
        
        <div id="infoContent" style="display:none;">
            <div class="info-header">
                <h2 id="viewTitle">수행평가 제목</h2>
                <p id="viewDate" style="color:#64748b; font-size:0.9rem; font-weight: bold; margin-top:5px;"></p>
            </div>

            <label style="font-size:0.85rem; font-weight:700; color:var(--primary); display:block; margin-bottom:4px;">📋 상세 메모 및 채점 기준(루브릭)</label>
            <textarea id="memoInput" class="memo-area" placeholder="수행평가 범위, 준비물, 채점 기준 등을 자유롭게 적어보세요."></textarea>

            <label style="font-size:0.85rem; font-weight:700; color:var(--primary); display:block; margin-bottom:4px; margin-top:10px;">🖼️ 등록된 평가 지표 / 안내 사진</label>
            <div class="image-gallery-container" id="imageGalleryNode">
                <div class="image-grid" id="imageGrid"></div>
            </div>

            <div class="edit-only">
                <div class="btn-group">
                    <label for="fileInput" class="btn-upload">📷 사진 추가 (다중 선택)</label>
                    <input type="file" id="fileInput" accept="image/*" multiple onchange="uploadPhotos(event)">
                    <button class="btn btn-save" onclick="saveData()">💾 변경사항 저장</button>
                </div>
                <div class="btn-group" style="margin-top:10px;">
                    <button class="btn" style="background:#f1f5f9; color: var(--text);" onclick="editTitle()">✏️ 일정 제목 수정</button>
                    <button class="btn btn-delete" onclick="deleteEvent()">🗑️ 해당 일정 삭제</button>
                </div>
            </div>
            
            <div id="studentNotice" style="font-size:0.8rem; color:#94a3b8; text-align:center; margin-top:10px;">
                ℹ️ 학생 모드에서는 일정 및 루브릭을 수정할 수 없습니다.
            </div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCHIC8vWvhsNSQdwxRPh56WTMGC89JuOXk",
        authDomain: "tngod-app.firebaseapp.com",
        databaseURL: "https://tngod-app-default-rtdb.firebaseio.com",
        projectId: "tngod-app",
        storageBucket: "tngod-app.firebasestorage.app",
        messagingSenderId: "986697110940",
        appId: "1:986697110940:web:038aeed8f8c3442f076459",
        measurementId: "G-ZVZJZF9EZ4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentDate = new Date();
    let remoteEvents = {};
    let selectedDateKey = null, selectedIndex = null;
    let currentGrade = null, currentClass = null;
    let isTeacher = false; // 오직 교사
    let isManager = false; // 임원 (편집권한 가짐)
    let dbListener = null;

    window.switchTab = (type) => {
        document.getElementById('tabStudent').classList.remove('active', 'student');
        document.getElementById('tabTeacher').classList.remove('active', 'teacher');
        document.getElementById('studentForm').style.display = 'none';
        document.getElementById('teacherForm').style.display = 'none';
        if(type === 'student') {
            document.getElementById('tabStudent').classList.add('active', 'student');
            document.getElementById('studentForm').style.display = 'block';
        } else {
            document.getElementById('tabTeacher').classList.add('active', 'teacher');
            document.getElementById('teacherForm').style.display = 'block';
        }
    };

    // 🎓 학생/임원 로그인
    window.loginStudent = () => {
        const inputId = document.getElementById('studentIdInput').value.trim();
        const managerCode = document.getElementById('managerCodeInput').value.trim();
        
        if (/^\d{5}$/.test(inputId)) {
            currentGrade = inputId.substring(0, 1);
            currentClass = parseInt(inputId.substring(1, 3), 10).toString();
            
            if (currentGrade >= 1 && currentGrade <= 3 && currentClass >= 1 && currentClass <= 14) {
                isTeacher = false;
                // 🌟 임원 인증 코드 확인 (필요시 변경)
                isManager = (managerCode === "1234"); 
                enterApp();
            } else { alert("학년/반 정보가 시스템 범위 바깥입니다."); }
        } else { alert("올바른 5자리 학번을 입력하세요."); }
    };

    // 👨‍🏫 교사 로그인
    window.loginTeacher = () => {
        const pw = document.getElementById('teacherPwInput').value.trim();
        if (pw === "admin") {
            isTeacher = true;
            isManager = true; // 교사는 임원 권한도 당연히 가짐
            currentGrade = "1"; // 초기 진입 학년
            currentClass = "1"; // 초기 진입 반
            enterApp();
        } else { alert("교사 비밀번호가 일치하지 않습니다."); }
    };

    function enterApp() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'grid';
        
        // 🚀 달력 즉시 렌더링 (빈화면 방지)
        renderCalendar();
        
        const displayArea = document.getElementById('classDisplayArea');
        const badge = document.getElementById('userRoleBadge');
        
        if (isTeacher) {
            badge.innerText = "교사";
            badge.style.background = "#ecfdf5"; badge.style.color = "var(--teacher-color)";
            // 교사 전용(초기화) 버튼 노출
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
            
            // 🌟 교사 전용 학급 실시간 선택 드롭다운 생성
            displayArea.innerHTML = `
                <select id="mainGradeSelect" class="top-select" onchange="handleClassChange()">
                    <option value="1">1학년</option><option value="2">2학년</option><option value="3">3학년</option>
                </select>
                <select id="mainClassSelect" class="top-select" onchange="handleClassChange()">
                    ${Array.from({length: 14}, (_, i) => `<option value="${i+1}">${i+1}반</option>`).join('')}
                </select>
            `;
            document.getElementById('mainGradeSelect').value = currentGrade;
            document.getElementById('mainClassSelect').value = currentClass;
        } else {
            // 학생 또는 임원
            if (isManager) {
                badge.innerText = "임원";
                badge.style.background = "#eff6ff"; badge.style.color = "var(--accent)";
            } else {
                badge.innerText = "학생";
                badge.style.background = "#f1f5f9"; badge.style.color = "var(--text)";
            }
            // 학생/임원은 학급 변경 불가 (텍스트 표시)
            displayArea.innerHTML = `<div class="class-title">${currentGrade}학년 ${currentClass}반</div>`;
        }

        // 🛠️ 편집 권한(임원 or 교사)이 있다면 편집 UI 노출
        if (isManager) {
            document.querySelectorAll('.edit-only').forEach(el => el.style.display = 'block');
            document.getElementById('studentNotice').style.display = 'none';
            document.getElementById('memoInput').removeAttribute('disabled');
            // 사진 삭제 버튼 활성화를 위한 클래스 부여
            document.getElementById('imageGalleryNode').classList.add('has-edit-auth');
        } else {
            document.querySelectorAll('.edit-only').forEach(el => el.style.display = 'none');
            document.getElementById('studentNotice').style.display = 'block';
            document.getElementById('memoInput').setAttribute('disabled', 'true');
        }
        
        listenToEvents();
    }

    // 교사용 학급 실시간 변경 함수
    window.handleClassChange = () => {
        currentGrade = document.getElementById('mainGradeSelect').value;
        currentClass = document.getElementById('mainClassSelect').value;
        
        // 상세창 초기화
        selectedDateKey = null; selectedIndex = null;
        document.getElementById('infoContent').style.display = 'none';
        document.getElementById('placeholder').style.display = 'block';
        
        listenToEvents();
    };

    function listenToEvents() {
        if (dbListener) db.ref(dbListener).off();
        dbListener = `grade_${currentGrade}/class_${currentClass}/events`;
        db.ref(dbListener).on("value", (snapshot) => {
            remoteEvents = snapshot.val() || {};
            renderCalendar();
            if(selectedDateKey) updateSidePanel();
        });
    }

    function renderCalendar() {
        const year = currentDate.getFullYear(), month = currentDate.getMonth();
        document.getElementById('monthYear').innerText = `${year}년 ${month + 1}월`;
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = ['일','월','화','수','목','금','토'].map(d => `<div class="day-name">${d}</div>`).join('');

        const first = new Date(year, month, 1).getDay();
        const last = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < first; i++) grid.innerHTML += `<div class="day" style="border:none; cursor:default;"></div>`;
        for (let i = 1; i <= last; i++) {
            const key = `${year}-${month + 1}-${i}`;
            const isToday = (new Date().toDateString() === new Date(year, month, i).toDateString()) ? 'today' : '';
            const events = (remoteEvents[key] || []).map((ev, idx) => 
                `<div class="event-item" id="ev-${key}-${idx}" onclick="selectEvent('${key}', ${idx}, event)">${ev.text}</div>`
            ).join('');
            grid.innerHTML += `<div class="day ${isToday}" onclick="clickDay('${key}')"><span class="day-number">${i}</span>${events}</div>`;
        }
    }

    window.clickDay = (key) => {
        if(!isManager) return; // 🌟 임원/교사만 일정 생성 가능
        
        const txt = prompt('새로운 수행평가 과목/항목을 생성합니다:');
        if (txt) {
            if (!remoteEvents[key]) remoteEvents[key] = [];
            // 사진 배열(images) 초기화 포함
            remoteEvents[key].push({ text: txt, rubricText: "", images: [] });
            db.ref(`grade_${currentGrade}/class_${currentClass}/events`).set(remoteEvents);
            selectEvent(key, remoteEvents[key].length - 1);
        }
    };

    window.selectEvent = (key, idx, e) => {
        if(e) e.stopPropagation();
        selectedDateKey = key;
        selectedIndex = idx;
        updateSidePanel();
    };

    function updateSidePanel() {
        if (!remoteEvents[selectedDateKey] || !remoteEvents[selectedDateKey][selectedIndex]) {
            document.getElementById('infoContent').style.display = 'none';
            document.getElementById('placeholder').style.display = 'block';
            return;
        }

        const ev = remoteEvents[selectedDateKey][selectedIndex];
        document.getElementById('placeholder').style.display = 'none';
        document.getElementById('infoContent').style.display = 'block';
        
        document.getElementById('viewTitle').innerText = ev.text;
        const dateParts = selectedDateKey.split('-');
        document.getElementById('viewDate').innerText = `${dateParts[0]}년 ${dateParts[1]}월 ${dateParts[2]}일`;
        document.getElementById('memoInput').value = ev.rubricText || "";
        
        const grid = document.getElementById('imageGrid');
        grid.innerHTML = '';
        
        // 📸 사진 데이터 처리 (복구된 핵심 로직)
        let imgList = ev.images || [];

        if (imgList.length === 0) {
            grid.innerHTML = `<p style="color:#cbd5e1; font-size:0.85rem; grid-column: 1/-1; text-align:center; padding: 20px 0;">등록된 기준표 이미지가 없습니다.</p>`;
        } else {
            imgList.forEach((src, imgIdx) => {
                // 개별 삭제 버튼 포함 (CSS에서 has-edit-auth로 제어됨)
                const deleteBtnHtml = `<button class="img-delete-btn" onclick="deleteSinglePhoto(${imgIdx}, event)">✕</button>`;
                grid.innerHTML += `
                    <div class="image-wrapper">
                        <img src="${src}" onclick="window.open('${src}')" title="클릭하면 큰 이미지로 확인합니다.">
                        ${deleteBtnHtml}
                    </div>
                `;
            });
        }
        
        // 달력 아이템 선택 스타일 처리
        document.querySelectorAll('.event-item').forEach(el => el.classList.remove('selected'));
        const target = document.getElementById(`ev-${selectedDateKey}-${selectedIndex}`);
        if(target) target.classList.add('selected');
    }

    // 💾 내용 저장 (텍스트 메모)
    window.saveData = () => {
        if(!isManager) return;
        const memo = document.getElementById('memoInput').value;
        remoteEvents[selectedDateKey][selectedIndex].rubricText = memo;
        db.ref(`grade_${currentGrade}/class_${currentClass}/events`).set(remoteEvents);
        alert("평가 루브릭 및 메모가 안전하게 저장되었습니다.");
    };

    window.editTitle = () => {
        if(!isManager) return;
        const newTitle = prompt("수정할 수행평가 제목을 입력하세요:", remoteEvents[selectedDateKey][selectedIndex].text);
        if(newTitle) {
            remoteEvents[selectedDateKey][selectedIndex].text = newTitle;
            db.ref(`grade_${currentGrade}/class_${currentClass}/events`).set(remoteEvents);
        }
    };

    // 📷 사진 다중 업로드 함수 (복구된 핵심 기능)
    window.uploadPhotos = (e) => {
        if(!isManager) return;
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        // 기존 사진 배열이 없으면 새로 생성
        if (!remoteEvents[selectedDateKey][selectedIndex].images) {
            remoteEvents[selectedDateKey][selectedIndex].images = [];
        }

        let loaded = 0;
        const currentEventImages = remoteEvents[selectedDateKey][selectedIndex].images;

        files.forEach(file => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                // base64 데이터를 배열에 추가
                currentEventImages.push(ev.target.result);
                loaded++;
                // 모든 사진이 로드되면 DB에 한 번에 저장
                if (loaded === files.length) {
                    db.ref(`grade_${currentGrade}/class_${currentClass}/events`).set(remoteEvents);
                    updateSidePanel(); // 화면 갱신
                    // 파일 입력창 초기화 (같은 사진 다시 올릴 수 있게)
                    e.target.value = '';
                }
            };
            reader.readAsDataURL(file);
        });
    };

    // ✕ 사진 개별 삭제 함수 (복구된 핵심 기능)
    window.deleteSinglePhoto = (imgIdx, e) => {
        if(!isManager) return;
        e.stopPropagation(); // 이미지 클릭 이벤트 전파 방지
        if (confirm("이 기준표 이미지를 삭제하시겠습니까?")) {
            // 배열에서 해당 인덱스 삭제
            remoteEvents[selectedDateKey][selectedIndex].images.splice(imgIdx, 1);
            db.ref(`grade_${currentGrade}/class_${currentClass}/events`).set(remoteEvents);
            updateSidePanel(); // 화면 갱신
        }
    };

    window.deleteEvent = () => {
        if(!isManager) return;
        if(confirm("이 수행평가 일정을 통째로 삭제하시겠습니까? (등록된 사진도 함께 삭제됩니다.)")) {
            remoteEvents[selectedDateKey].splice(selectedIndex, 1);
            if(remoteEvents[selectedDateKey].length === 0) delete remoteEvents[selectedDateKey];
            db.ref(`grade_${currentGrade}/class_${currentClass}/events`).set(remoteEvents);
            
            // 상세창 초기화
            selectedDateKey = null; selectedIndex = null;
            document.getElementById('infoContent').style.display = 'none';
            document.getElementById('placeholder').style.display = 'block';
        }
    };

    // ⚠️ 오직 교사만 가능한 반 전체 초기화
    window.resetAllData = () => {
        if(!isTeacher) return;
        if (confirm(`⚠️ 대경고: [${currentGrade}학년 ${currentClass}반]의 모든 일정이 영구 파괴됩니다. 진행하시겠습니까?`)) {
            db.ref(`grade_${currentGrade}/class_${currentClass}/events`).set(null).then(() => {
                alert("반 전체 달력이 완전히 초기화되었습니다.");
                location.reload();
            });
        }
    };

    window.changeMonth = (v) => { currentDate.setMonth(currentDate.getMonth() + v); renderCalendar(); };
    document.getElementById('studentIdInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') loginStudent(); });
    document.getElementById('teacherPwInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') loginTeacher(); });
</script>
</body>
</html>
