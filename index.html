<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 공유 수행평가 달력</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { --bg-color: #f4f7f6; --card-bg: #ffffff; --primary-color: #4a90e2; --accent-color: #e74c3c; --success-color: #2ecc71; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-color); display: flex; justify-content: center; padding: 30px 20px; margin: 0; }
        
        .app-wrapper { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 20px; }
        .calendar-container, .action-panel { background: var(--card-bg); border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); padding: 30px; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px dashed #eee; }
        .class-selector { font-size: 1.1rem; font-weight: bold; padding: 8px 12px; border-radius: 8px; border: 2px solid var(--primary-color); color: #333; cursor: pointer; }
        
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .calendar-header h1 { font-size: 1.6rem; color: #333; margin: 0; }
        .calendar-header button { background: var(--bg-color); border: none; font-size: 1.2rem; cursor: pointer; color: var(--primary-color); padding: 5px 15px; border-radius: 8px; }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .day-name { text-align: center; font-weight: bold; font-size: 0.9rem; color: #888; padding-bottom: 10px; }
        .day { background: #fff; border: 1px solid #eee; min-height: 100px; padding: 5px; border-radius: 8px; display: flex; flex-direction: column; cursor: pointer; position: relative; }
        .day.today { background: #eef5ff; border: 2px solid var(--primary-color); }
        .day-number { font-size: 1rem; font-weight: bold; color: #555; margin-bottom: 5px; }

        .event { background-color: var(--primary-color); color: white; border-radius: 4px; padding: 4px; margin-bottom: 3px; font-size: 0.8rem; font-weight: bold; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .event.selected { background-color: #2c3e50; transform: scale(1.05); }

        .action-panel { display: none; text-align: center; border: 2px solid var(--primary-color); }
        .action-buttons { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .action-buttons button { padding: 10px 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; }
        
        /* 팝업창(모달) */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .rubric-modal { background: white; width: 90%; max-width: 500px; border-radius: 12px; padding: 20px; text-align: center; }
        .rubric-content { margin: 15px 0; border: 1px solid #ddd; min-height: 200px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .rubric-content img { max-width: 100%; height: auto; }
        
        #fileInput { display: none; }
        .btn-upload { background: var(--primary-color); color: white; padding: 10px 15px; border-radius: 5px; cursor: pointer; display: inline-block; }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div class="calendar-container">
        <div class="top-bar">
            <select id="classSelect" class="class-selector" onchange="changeClass()"></select>
            <span id="syncStatus" style="color: var(--success-color); font-size: 0.8rem;">연결됨 ●</span>
        </div>

        <div class="calendar-header">
            <button onclick="changeMonth(-1)">◀</button>
            <h1 id="monthYear">📅</h1>
            <button onclick="changeMonth(1)">▶</button>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <div class="action-panel" id="actionPanel">
        <h3 id="selectedEventTitle" style="margin-top:0;">일정 정보</h3>
        <div class="action-buttons">
            <button style="background:var(--success-color)" onclick="openRubricModal()">📂 열기</button>
            <button style="background:var(--primary-color)" onclick="editEvent()">✏️ 수정</button>
            <button style="background:var(--accent-color)" onclick="deleteEvent()">🗑️ 삭제</button>
            <button style="background:#95a5a6" onclick="closePanel()">닫기</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="rubric-modal">
        <h3 id="modalTitle">평가기준표</h3>
        <div class="rubric-content" id="rubricContent"></div>
        <div style="margin-top:15px; display:flex; justify-content:center; gap:10px;">
            <label for="fileInput" class="btn-upload">📷 사진 올리기</label>
            <input type="file" id="fileInput" accept="image/*" onchange="uploadPhoto(event)">
            <button onclick="closeRubricModal()" style="padding:10px 20px; border-radius:5px; border:1px solid #ccc;">닫기</button>
        </div>
    </div>
</div>

<script>
    // ✅ 사용자가 제공한 Firebase 설정값 적용 완료!
    const firebaseConfig = {
        apiKey: "AIzaSyCHIC8vWvhsNSQdwxRPh56WTMGC89JuOXk",
        authDomain: "tngod-app.firebaseapp.com",
        databaseURL: "https://tngod-app-default-rtdb.firebaseio.com",
        projectId: "tngod-app",
        storageBucket: "tngod-app.firebasestorage.app",
        messagingSenderId: "986697110940",
        appId: "1:986697110940:web:038aeed8f8c3442f076459",
        measurementId: "G-ZVZJZF9EZ4"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentDate = new Date();
    let remoteEvents = {};
    let selectedDateKey = null, selectedIndex = null;
    let currentClass = "1"; 
    let dbListener = null;

    // 반 선택 메뉴 자동 생성 (1~14반)
    const classSelect = document.getElementById('classSelect');
    for (let i = 1; i <= 14; i++) {
        classSelect.innerHTML += `<option value="${i}">${i}반 수행평가 달력</option>`;
    }

    window.changeClass = () => {
        currentClass = classSelect.value;
        closePanel();
        listenToEvents();
    };

    function listenToEvents() {
        if (dbListener) db.ref(dbListener).off();
        dbListener = `classes/class_${currentClass}/events`;
        document.getElementById('syncStatus').innerText = "불러오는 중...";
        
        db.ref(dbListener).on("value", (snapshot) => {
            remoteEvents = snapshot.val() || {};
            render();
            document.getElementById('syncStatus').innerText = "연결됨 ●";
            document.getElementById('syncStatus').style.color = "var(--success-color)";
        });
    }

    function syncToCloud() {
        db.ref(`classes/class_${currentClass}/events`).set(remoteEvents);
    }

    function render() {
        const year = currentDate.getFullYear(), month = currentDate.getMonth();
        document.getElementById('monthYear').innerText = `📅 ${year}년 ${month + 1}월`;
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = ['일','월','화','수','목','금','토'].map(d => `<div class="day-name">${d}</div>`).join('');

        const first = new Date(year, month, 1).getDay();
        const last = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < first; i++) grid.innerHTML += `<div class="day" style="border:none"></div>`;
        for (let i = 1; i <= last; i++) {
            const key = `${year}-${month}-${i}`;
            const isToday = (new Date().toDateString() === new Date(year, month, i).toDateString()) ? 'today' : '';
            const events = (remoteEvents[key] || []).map((ev, idx) => 
                `<div class="event" id="ev-${key}-${idx}" onclick="selectEv('${key}', ${idx}, '${ev.text}', event)">${ev.text}</div>`
            ).join('');
            grid.innerHTML += `<div class="day ${isToday}" onclick="addEv(${year}, ${month}, ${i})"><span class="day-number">${i}</span>${events}</div>`;
        }
    }

    window.addEv = (y, m, d) => {
        const txt = prompt('수행평가 내용을 입력하세요:');
        if (txt) {
            const key = `${y}-${m}-${d}`;
            if (!remoteEvents[key]) remoteEvents[key] = [];
            remoteEvents[key].push({ text: txt, rubric: null });
            syncToCloud();
        }
    };

    window.selectEv = (key, idx, txt, e) => {
        e.stopPropagation();
        selectedDateKey = key; selectedIndex = idx;
        document.querySelectorAll('.event').forEach(el => el.classList.remove('selected'));
        document.getElementById(`ev-${key}-${idx}`).classList.add('selected');
        document.getElementById('selectedEventTitle').innerText = txt;
        document.getElementById('actionPanel').style.display = 'block';
    };

    window.openRubricModal = () => {
        const ev = remoteEvents[selectedDateKey][selectedIndex];
        document.getElementById('modalTitle').innerText = `📄 ${ev.text} 기준표`;
        document.getElementById('rubricContent').innerHTML = ev.rubric ? `<img src="${ev.rubric}">` : `<p style="color:#888">사진을 등록해주세요.</p>`;
        document.getElementById('modalOverlay').style.display = 'flex';
    };

    window.uploadPhoto = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
            remoteEvents[selectedDateKey][selectedIndex].rubric = ev.target.result;
            syncToCloud();
            openRubricModal();
        };
        if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
    };

    window.editEvent = () => {
        const newTxt = prompt('내용 수정:', remoteEvents[selectedDateKey][selectedIndex].text);
        if (newTxt) {
            remoteEvents[selectedDateKey][selectedIndex].text = newTxt;
            syncToCloud();
        }
    };

    window.deleteEvent = () => {
        if(confirm('정말 삭제할까요?')) {
            remoteEvents[selectedDateKey].splice(selectedIndex, 1);
            syncToCloud();
            closePanel();
        }
    };

    window.closePanel = () => { document.getElementById('actionPanel').style.display = 'none'; };
    window.closeRubricModal = () => document.getElementById('modalOverlay').style.display = 'none';
    window.changeMonth = (v) => { currentDate.setMonth(currentDate.getMonth() + v); render(); };

    listenToEvents(); // 실행 시작
</script>
</body>
</html>
