<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수행평가 통합 관리 시스템</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1e293b; --accent: #3b82f6; --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0; --text: #334155; --teacher-color: #10b981; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; min-height: 100vh; }
        .login-container { width: 100%; max-width: 440px; background: var(--card); padding: 40px; border-radius: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.05); align-self: center; border: 1px solid var(--border); }
        .login-tabs { display: flex; gap: 10px; margin-bottom: 25px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 12px; font-size: 1.05rem; font-weight: bold; cursor: pointer; background: #f1f5f9; color: #94a3b8; transition: 0.2s; }
        .tab-btn.active.student { background: var(--accent); color: white; }
        .tab-btn.active.teacher { background: var(--teacher-color); color: white; }
        .login-input { width: 100%; padding: 14px; margin-bottom: 15px; border: 2px solid var(--border); border-radius: 12px; font-size: 1.1rem; box-sizing: border-box; text-align: center; }
        .login-btn { width: 100%; padding: 14px; color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        .btn-student { background: var(--accent); }
        .btn-teacher { background: var(--teacher-color); }
        .app-wrapper { display: none; width: 100%; max-width: 1400px; padding: 40px 20px; gap: 30px; grid-template-columns: 1.4fr 1.6fr; }
        .calendar-section, .info-section { background: var(--card); border-radius: 24px; padding: 30px; border: 1px solid var(--border); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .calendar-nav { display: flex; align-items: center; gap: 15px; }
        .nav-btn { background: #f1f5f9; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
        .day { background: #fff; border: 1px solid var(--border); min-height: 100px; padding: 8px; border-radius: 12px; cursor: pointer; position: relative; }
        .day.today { border: 2px solid var(--accent); }
        .event-item { background: var(--accent); color: white; border-radius: 6px; padding: 4px 8px; font-size: 0.75rem; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .event-item.selected { background: var(--primary); }
        .memo-area { width: 100%; height: 240px; border: 1px solid var(--border); border-radius: 14px; padding: 15px; box-sizing: border-box; resize: vertical; }
        .teacher-only { display: none; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        .btn { padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; flex: 1; }
        .role-badge { padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; margin-top: 10px; }
        .image-wrapper { position: relative; width: 80px; height: 80px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        .image-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

<div class="login-container" id="loginScreen">
    <h2 style="text-align:center;">🎓 수행평가 통합 시스템</h2>
    <div class="login-tabs">
        <button class="tab-btn active student" id="tabStudent" onclick="switchTab('student')">학생 로그인</button>
        <button class="tab-btn" id="tabTeacher" onclick="switchTab('teacher')">교사 로그인</button>
    </div>
    <div id="studentForm">
        <input type="text" id="studentIdInput" class="login-input" placeholder="학번 5자리 (예: 10312)" maxlength="5">
        <input type="password" id="managerCodeInput" class="login-input" placeholder="임원 인증 코드 (일반학생 생략)" maxlength="4">
        <button class="login-btn btn-student" onclick="loginStudent()">조회하기</button>
    </div>
    <div id="teacherForm" style="display: none;">
        <input type="password" id="teacherPwInput" class="login-input" placeholder="교사 비밀번호">
        <button class="login-btn btn-teacher" onclick="loginTeacher()">관리자로 입장</button>
    </div>
</div>

<div class="app-wrapper" id="mainApp">
    <div class="calendar-section">
        <div class="top-bar">
            <div class="calendar-nav">
                <button class="nav-btn" onclick="changeMonth(-1)">◀</button>
                <h1 id="monthYear" style="font-size: 1.2rem;"></h1>
                <button class="nav-btn" onclick="changeMonth(1)">▶</button>
            </div>
            <div id="userRoleBadge" class="role-badge"></div>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
        <button class="btn-reset teacher-only" onclick="resetAllData()" style="margin-top:20px; color:red; background:none; border:none; cursor:pointer;">⚠️ 전체 데이터 초기화</button>
    </div>
    <div class="info-section">
        <div id="infoContent" style="display:none;">
            <h2 id="viewTitle"></h2>
            <textarea id="memoInput" class="memo-area"></textarea>
            <div id="imageGrid" class="image-grid"></div>
            <div class="teacher-only">
                <div class="btn-group">
                    <button class="btn" style="background:var(--accent); color:white;" onclick="saveData()">저장</button>
                    <button class="btn" style="background:#fee2e2; color:#ef4444;" onclick="deleteEvent()">삭제</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCHIC8vWvhsNSQdwxRPh56WTMGC89JuOXk",
        authDomain: "tngod-app.firebaseapp.com",
        databaseURL: "https://tngod-app-default-rtdb.firebaseio.com",
        projectId: "tngod-app",
        storageBucket: "tngod-app.firebasestorage.app",
        messagingSenderId: "986697110940",
        appId: "1:986697110940:web:038aeed8f8c3442f076459"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let isTeacher = false, currentGrade, currentClass, remoteEvents = {}, selectedDateKey, selectedIndex, currentDate = new Date();

    window.switchTab = (type) => {
        document.getElementById('studentForm').style.display = type === 'student' ? 'block' : 'none';
        document.getElementById('teacherForm').style.display = type === 'teacher' ? 'block' : 'none';
    };

    window.loginStudent = () => {
        const inputId = document.getElementById('studentIdInput').value.trim();
        const managerCode = document.getElementById('managerCodeInput').value.trim();
        if (/^\d{5}$/.test(inputId)) {
            currentGrade = inputId.substring(0, 1);
            currentClass = parseInt(inputId.substring(1, 3), 10).toString();
            // 🌟 수정 권한 부여 로직: 인증코드가 1234일 때 교사 권한 부여
            isTeacher = (managerCode === "1234");
            enterApp();
        } else { alert("올바른 학번을 입력하세요."); }
    };

    window.loginTeacher = () => {
        if(document.getElementById('teacherPwInput').value === "admin") {
            isTeacher = true; currentGrade = "1"; currentClass = "3"; enterApp();
        } else { alert("비밀번호 불일치"); }
    };

    function enterApp() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'grid';
        if (isTeacher) document.querySelectorAll('.teacher-only').forEach(el => el.style.display = 'block');
        document.getElementById('userRoleBadge').innerText = isTeacher ? "관리자 권한" : "학생 조회용";
        listenToEvents();
    }

    function listenToEvents() {
        db.ref(`grade_${currentGrade}/class_${currentClass}/events`).on("value", (s) => {
            remoteEvents = s.val() || {};
            renderCalendar();
        });
    }

    function renderCalendar() {
        const year = currentDate.getFullYear(), month = currentDate.getMonth();
        document.getElementById('monthYear').innerText = `${year}년 ${month + 1}월`;
        const grid = document.getElementById('calendarGrid'); grid.innerHTML = '';
        const first = new Date(year, month, 1).getDay();
        const last = new Date(year, month + 1, 0).getDate();
        for(let i=0; i<first; i++) grid.innerHTML += `<div></div>`;
        for(let i=1; i<=last; i++) {
            const key = `${year}-${month+1}-${i}`;
            const events = (remoteEvents[key] || []).map((ev, idx) => `<div class="event-item" onclick="selectEvent('${key}', ${idx})">${ev.text}</div>`).join('');
            grid.innerHTML += `<div class="day" onclick="clickDay('${key}')">${i}${events}</div>`;
        }
    }

    window.clickDay = (key) => {
        if(!isTeacher) return;
        const txt = prompt('일정 입력:');
        if(txt) {
            if(!remoteEvents[key]) remoteEvents[key] = [];
            remoteEvents[key].push({text: txt, rubricText: ""});
            db.ref(`grade_${currentGrade}/class_${currentClass}/events`).set(remoteEvents);
        }
    };

    window.selectEvent = (key, idx) => {
        selectedDateKey = key; selectedIndex = idx;
        document.getElementById('infoContent').style.display = 'block';
        document.getElementById('viewTitle').innerText = remoteEvents[key][idx].text;
        document.getElementById('memoInput').value = remoteEvents[key][idx].rubricText || "";
    };

    window.saveData = () => {
        if(!isTeacher) return;
        remoteEvents[selectedDateKey][selectedIndex].rubricText = document.getElementById('memoInput').value;
        db.ref(`grade_${currentGrade}/class_${currentClass}/events`).set(remoteEvents);
        alert("저장 완료");
    };

    window.deleteEvent = () => {
        if(!isTeacher) return;
        remoteEvents[selectedDateKey].splice(selectedIndex, 1);
        db.ref(`grade_${currentGrade}/class_${currentClass}/events`).set(remoteEvents);
        document.getElementById('infoContent').style.display = 'none';
    };

    window.resetAllData = () => { if(confirm("초기화?")) db.ref(`grade_${currentGrade}/class_${currentClass}/events`).set(null).then(() => location.reload()); };
    window.changeMonth = (v) => { currentDate.setMonth(currentDate.getMonth() + v); renderCalendar(); };
</script>
</body>
</html>
