<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수행평가 통합 관리 시스템</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e293b; --accent: #3b82f6; --bg: #f8fafc;
            --card: #ffffff; --border: #e2e8f0; --text: #334155;
        }

        body {
            font-family: 'Pretendard', sans-serif; background-color: var(--bg);
            color: var(--text); margin: 0; display: flex; justify-content: center; min-height: 100vh;
        }

        /* 🌟 로그인 화면 비율 조정 (황금비율 적용 및 컴팩트화) */
        .login-container {
            width: 100%; max-width: 420px; background: var(--card); padding: 45px 35px;
            border-radius: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.05), 0 10px 10px -5px rgba(0,0,0,0.04);
            text-align: center; align-self: center; border: 1px solid var(--border);
        }
        .login-input {
            width: 100%; padding: 14px; margin: 20px 0; border: 2px solid var(--border);
            border-radius: 12px; font-size: 1.3rem; text-align: center; letter-spacing: 6px; font-weight: bold;
            box-sizing: border-box; transition: 0.2s;
        }
        .login-input:focus { border-color: var(--accent); outline: none; background: #fff; }
        .login-btn {
            width: 100%; padding: 14px; background: var(--accent); color: white;
            border: none; border-radius: 12px; font-size: 1.05rem; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .login-btn:hover { background: #2563eb; }

        /* 🌟 메인 대시보드 레이아웃 비율 조정 (달력 1.5 : 상세창 1.5 수준으로 우측 공간 대폭 확대) */
        .app-wrapper {
            display: none; width: 100%; max-width: 1400px; padding: 40px 20px;
            gap: 30px; grid-template-columns: 1.4fr 1.6fr; box-sizing: border-box;
        }

        .calendar-section, .info-section {
            background: var(--card); border-radius: 24px; padding: 30px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03); border: 1px solid var(--border);
            box-sizing: border-box;
        }

        /* 달력 헤더 */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .calendar-nav { display: flex; align-items: center; gap: 15px; }
        .calendar-nav h1 { font-size: 1.4rem; margin: 0; color: var(--primary); }
        .nav-btn { background: #f1f5f9; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .nav-btn:hover { background: #e2e8f0; }

        /* 달력 그리드 */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .day-name { text-align: center; font-weight: 600; font-size: 0.85rem; color: #94a3b8; padding-bottom: 8px; }
        .day {
            background: #fff; border: 1px solid var(--border); min-height: 100px;
            padding: 8px; border-radius: 12px; cursor: pointer; transition: 0.2s;
            display: flex; flex-direction: column; gap: 4px; box-sizing: border-box;
        }
        .day:hover { border-color: var(--accent); background: #f8fafc; }
        .day.today { border: 2px solid var(--accent); background: #eff6ff; }
        .day-number { font-weight: 700; font-size: 0.9rem; margin-bottom: 2px; display: block; }

        .event-item {
            background: var(--accent); color: white; border-radius: 6px;
            padding: 4px 8px; font-size: 0.75rem; font-weight: 600;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .event-item.selected { background: var(--primary); outline: 2px solid var(--accent); }

        /* 🌟 우측 상세 정보창 비율 및 크기 확장 */
        .info-section { position: sticky; top: 40px; height: fit-content; display: flex; flex-direction: column; gap: 18px; }
        .info-placeholder { color: #94a3b8; text-align: center; padding: 150px 0; font-size: 1.05rem; line-height: 1.6; }
        
        .info-header { border-bottom: 2px solid var(--bg); padding-bottom: 15px; margin-bottom: 5px; }
        .info-header h2 { margin: 0; font-size: 1.5rem; color: var(--primary); word-break: break-all; }
        
        /* 텍스트 입력창 크기 대폭 확장 */
        .memo-area {
            width: 100%; height: 240px; border: 1px solid var(--border); border-radius: 14px;
            padding: 18px; font-family: inherit; font-size: 1rem; line-height: 1.6; resize: vertical;
            background: #f8fafc; box-sizing: border-box; color: #1e293b; transition: 0.2s;
        }
        .memo-area:focus { background: #fff; border-color: var(--accent); outline: none; }

        /* 🌟 다중 이미지 갤러리 그리드 레이아웃 */
        .image-gallery-container {
            border: 1px dashed var(--border); border-radius: 14px; padding: 15px;
            background: #f8fafc; min-height: 120px; box-sizing: border-box;
        }
        .image-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; margin-top: 5px;
        }
        .image-wrapper {
            position: relative; aspect-ratio: 1 / 1; border-radius: 8px; overflow: hidden;
            border: 1px solid var(--border); background: #fff; display: flex; justify-content: center; align-items: center;
        }
        .image-wrapper img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
        
        /* 이미지 개별 삭제 버튼 */
        .img-delete-btn {
            position: absolute; top: 4px; right: 4px; background: rgba(239, 68, 68, 0.9);
            color: white; border: none; border-radius: 5px; width: 22px; height: 22px;
            font-size: 11px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn {
            flex: 1; padding: 12px; border: none; border-radius: 10px;
            font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 0.9rem;
        }
        .btn-save { background: var(--accent); color: white; }
        .btn-save:hover { background: #2563eb; }
        .btn-delete { background: #fee2e2; color: #ef4444; }
        .btn-delete:hover { background: #fecaca; }
        .btn-upload { background: #f1f5f9; color: var(--text); border: 1px solid var(--border); text-align: center; display: block; }
        .btn-upload:hover { background: #e2e8f0; }

        .btn-reset {
            background: none; border: 1px solid #fee2e2; color: #ef4444; padding: 6px 12px;
            border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: 0.2s;
        }
        .btn-reset:hover { background: #fee2e2; }

        #fileInput { display: none; }

        @media (max-width: 1024px) {
            .app-wrapper { grid-template-columns: 1fr; }
            .info-section { position: static; }
        }
    </style>
</head>
<body>

<div class="login-container" id="loginScreen">
    <h2 style="font-size:1.6rem; margin-bottom:5px;">🎓 수행평가 관리 시스템</h2>
    <p style="color:#64748b; margin-top:5px; font-size:0.9rem;">5자리 학번을 입력하여 로그인하세요.</p>
    <input type="text" id="studentIdInput" class="login-input" placeholder="10312" maxlength="5">
    <button class="login-btn" onclick="checkStudentID()">시스템 접속하기</button>
</div>

<div class="app-wrapper" id="mainApp">
    <div class="calendar-section">
        <div class="top-bar">
            <div class="calendar-nav">
                <button class="nav-btn" onclick="changeMonth(-1)">◀</button>
                <h1 id="monthYear">2026년 6월</h1>
                <button class="nav-btn" onclick="changeMonth(1)">▶</button>
            </div>
            <div style="font-weight:700; color:var(--accent); font-size:1.1rem;" id="classTitle">1학년 3반</div>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
        
        <div style="margin-top:20px; display: flex; justify-content: space-between; align-items: center;">
            <button class="btn-reset" onclick="resetAllData()">⚠️ 반 전체 초기화</button>
            <button onclick="location.reload()" style="background:none; border:none; color:#94a3b8; cursor:pointer; font-size:0.8rem;">🔄 로그아웃</button>
        </div>
    </div>

    <div class="info-section" id="infoSection">
        <div class="info-placeholder" id="placeholder">
            <p>📅 달력의 날짜나<br>수행평가 항목을 선택하세요.</p>
        </div>
        
        <div id="infoContent" style="display:none;">
            <div class="info-header">
                <h2 id="viewTitle">수행평가 제목</h2>
                <p id="viewDate" style="color:#64748b; font-size:0.9rem; font-weight: bold; margin-top:5px;">2026년 6월 12일</p>
            </div>

            <label style="font-size:0.85rem; font-weight:700; color:var(--primary); display:block; margin-bottom:4px;">📋 상세 메모 및 기준</label>
            <textarea id="memoInput" class="memo-area" placeholder="수행평가 범위, 준비물, 채점 기준 등을 자유롭게 적어보세요."></textarea>

            <label style="font-size:0.85rem; font-weight:700; color:var(--primary); display:block; margin-bottom:4px;">🖼️ 관련 이미지 / 평가지표 (여러 장 가능)</label>
            <div class="image-gallery-container">
                <div class="image-grid" id="imageGrid">
                    </div>
            </div>

            <div class="btn-group">
                <label for="fileInput" class="btn btn-upload">📷 사진 추가 (다중 선택 가능)</label>
                <input type="file" id="fileInput" accept="image/*" multiple onchange="uploadPhotos(event)">
                <button class="btn btn-save" onclick="saveData()">💾 변경사항 저장</button>
            </div>
            <div class="btn-group" style="margin-top:10px;">
                <button class="btn" style="background:#f1f5f9;" onclick="editTitle()">✏️ 제목 수정</button>
                <button class="btn btn-delete" onclick="deleteEvent()">🗑️ 전체 삭제</button>
            </div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCHIC8vWvhsNSQdwxRPh56WTMGC89JuOXk",
        authDomain: "tngod-app.firebaseapp.com",
        databaseURL: "https://tngod-app-default-rtdb.firebaseio.com",
        projectId: "tngod-app",
        storageBucket: "tngod-app.firebasestorage.app",
        messagingSenderId: "986697110940",
        appId: "1:986697110940:web:038aeed8f8c3442f076459",
        measurementId: "G-ZVZJZF9EZ4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentDate = new Date();
    let remoteEvents = {};
    let selectedDateKey = null, selectedIndex = null;
    let currentGrade = null, currentClass = null;
    let dbListener = null;

    window.checkStudentID = () => {
        const inputId = document.getElementById('studentIdInput').value.trim();
        if (inputId === "admin") {
            currentGrade = "1"; currentClass = "1";
            enterApp(); return;
        }
        if (/^\d{5}$/.test(inputId)) {
            currentGrade = inputId.substring(0, 1);
            currentClass = parseInt(inputId.substring(1, 3), 10).toString();
            if (currentGrade >= 1 && currentGrade <= 3 && currentClass >= 1 && currentClass <= 14) {
                enterApp();
            } else { alert("학년/반 정보가 올바르지 않습니다."); }
        } else { alert("5자리 학번을 입력해 주세요."); }
    };

    function enterApp() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'grid';
        document.getElementById('classTitle').innerText = `${currentGrade}학년 ${currentClass}반`;
        listenToEvents();
    }

    function listenToEvents() {
        if (dbListener) db.ref(dbListener).off();
        dbListener = `grade_${currentGrade}/class_${currentClass}/events`;
        db.ref(dbListener).on("value", (snapshot) => {
            remoteEvents = snapshot.val() || {};
            renderCalendar();
            if(selectedDateKey) updateSidePanel();
        });
    }

    function renderCalendar() {
        const year = currentDate.getFullYear(), month = currentDate.getMonth();
        document.getElementById('monthYear').innerText = `${year}년 ${month + 1}월`;
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = ['일','월','화','수','목','금','토'].map(d => `<div class="day-name">${d}</div>`).join('');

        const first = new Date(year, month, 1).getDay();
        const last = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < first; i++) grid.innerHTML += `<div class="day" style="border:none"></div>`;
        for (let i = 1; i <= last; i++) {
            const key = `${year}-${month + 1}-${i}`;
            const isToday = (new Date().toDateString() === new Date(year, month, i).toDateString()) ? 'today' : '';
            const events = (remoteEvents[key] || []).map((ev, idx) => 
                `<div class="event-item" id="ev-${key}-${idx}" onclick="selectEvent('${key}', ${idx}, event)">${ev.text}</div>`
            ).join('');
            grid.innerHTML += `<div class="day ${isToday}" onclick="clickDay('${key}')"><span class="day-number">${i}</span>${events}</div>`;
        }
    }

    window.clickDay = (key) => {
        const txt = prompt('새로운 수행평가 항목을 입력하세요:');
        if (txt) {
            if (!remoteEvents[key]) remoteEvents[key] = [];
            remoteEvents[key].push({ text: txt, rubric: null, rubricText: "", images: [] });
            db.ref(`grade_${currentGrade}/class_${currentClass}/events`).set(remoteEvents);
            selectEvent(key, remoteEvents[key].length - 1);
        }
    };

    window.selectEvent = (key, idx, e) => {
        if(e) e.stopPropagation();
        selectedDateKey = key;
        selectedIndex = idx;
        updateSidePanel();
    };

    function updateSidePanel() {
        if (!remoteEvents[selectedDateKey] || !remoteEvents[selectedDateKey][selectedIndex]) {
            document.getElementById('infoContent').style.display = 'none';
            document.getElementById('placeholder').style.display = 'block';
            return;
        }

        const ev = remoteEvents[selectedDateKey][selectedIndex];
        document.getElementById('placeholder').style.display = 'none';
        document.getElementById('infoContent').style.display = 'block';
        
        document.getElementById('viewTitle').innerText = ev.text;
        const dateParts = selectedDateKey.split('-');
        document.getElementById('viewDate').innerText = `${dateParts[0]}년 ${dateParts[1]}월 ${dateParts[2]}일`;
        document.getElementById('memoInput').value = ev.rubricText || "";
        
        // 🌟 다중 이미지 하이브리드 바인딩 (기존 rubric 단일 데이터 호환 포함)
        const grid = document.getElementById('imageGrid');
        grid.innerHTML = '';
        
        let imgList = ev.images || [];
        if (ev.rubric && imgList.length === 0) {
            imgList = [ev.rubric]; // 예전 데이터 싱크 맞춤
        }

        if (imgList.length === 0) {
            grid.innerHTML = `<p style="color:#cbd5e1; font-size:0.85rem; grid-column: 1/-1; text-align:center; padding: 20px 0;">등록된 이미지가 없습니다.</p>`;
        } else {
            imgList.forEach((src, imgIdx) => {
                grid.innerHTML += `
                    <div class="image-wrapper">
                        <img src="${src}" onclick="window.open('${src}')" title="클릭하면 크게 봅니다">
                        <button class="img-delete-btn" onclick="deleteSinglePhoto(${imgIdx}, event)">✕</button>
                    </div>
                `;
            });
        }
        
        document.querySelectorAll('.event-item').forEach(el => el.classList.remove('selected'));
        const target = document.getElementById(`ev-${selectedDateKey}-${selectedIndex}`);
        if(target) target.classList.add('selected');
    }

    window.saveData = () => {
        const memo = document.getElementById('memoInput').value;
        remoteEvents[selectedDateKey][selectedIndex].rubricText = memo;
        db.ref(`grade_${currentGrade}/class_${currentClass}/events`).set(remoteEvents);
        alert("변경사항이 저장되었습니다.");
    };

    window.editTitle = () => {
        const newTitle = prompt("수정할 제목을 입력하세요:", remoteEvents[selectedDateKey][selectedIndex].text);
        if(newTitle) {
            remoteEvents[selectedDateKey][selectedIndex].text = newTitle;
            db.ref(`grade_${currentGrade}/class_${currentClass}/events`).set(remoteEvents);
        }
    };

    // 🌟 다중 이미지 업로드 시스템
    window.uploadPhotos = (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        if (!remoteEvents[selectedDateKey][selectedIndex].images) {
            remoteEvents[selectedDateKey][selectedIndex].images = [];
        }

        // 기존에 혹시 rubric 필드에 구버전 데이터가 남아있었다면 배열로 이관
        if (remoteEvents[selectedDateKey][selectedIndex].rubric) {
            remoteEvents[selectedDateKey][selectedIndex].images.push(remoteEvents[selectedDateKey][selectedIndex].rubric);
            remoteEvents[selectedDateKey][selectedIndex].rubric = null; 
        }

        let loaded = 0;
        files.forEach(file => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                remoteEvents[selectedDateKey][selectedIndex].images.push(ev.target.result);
                loaded++;
                if (loaded === files.length) {
                    db.ref(`grade_${currentGrade}/class_${currentClass}/events`).set(remoteEvents);
                    updateSidePanel();
                }
            };
            reader.readAsDataURL(file);
        });
    };

    // 🌟 특정 이미지 한 장만 삭제하는 기능
    window.deleteSinglePhoto = (imgIdx, e) => {
        e.stopPropagation();
        if (confirm("이 사진을 삭제하시겠습니까?")) {
            // 구버전 예외 처리 후 정식 배열 정제
            if (remoteEvents[selectedDateKey][selectedIndex].rubric) {
                remoteEvents[selectedDateKey][selectedIndex].images = [remoteEvents[selectedDateKey][selectedIndex].rubric];
                remoteEvents[selectedDateKey][selectedIndex].rubric = null;
            }
            
            remoteEvents[selectedDateKey][selectedIndex].images.splice(imgIdx, 1);
            db.ref(`grade_${currentGrade}/class_${currentClass}/events`).set(remoteEvents);
            updateSidePanel();
        }
    };

    window.deleteEvent = () => {
        if(confirm("정말 이 일정을 삭제하시겠습니까?")) {
            remoteEvents[selectedDateKey].splice(selectedIndex, 1);
            if(remoteEvents[selectedDateKey].length === 0) delete remoteEvents[selectedDateKey];
            db.ref(`grade_${currentGrade}/class_${currentClass}/events`).set(remoteEvents);
            selectedDateKey = null;
            selectedIndex = null;
            document.getElementById('infoContent').style.display = 'none';
            document.getElementById('placeholder').style.display = 'block';
        }
    };

    window.resetAllData = () => {
        if (confirm(`⚠️ 경고: [${currentGrade}학년 ${currentClass}반]의 모든 일정이 영구 삭제됩니다. 계속하시겠습니까?`)) {
            if (confirm(`정말로 삭제하시겠습니까? 삭제된 데이터는 절대로 복구할 수 없습니다.`)) {
                db.ref(`grade_${currentGrade}/class_${currentClass}/events`).set(null).then(() => {
                    alert(`${currentGrade}학년 ${currentClass}반 달력이 완전히 초기화되었습니다.`);
                    selectedDateKey = null; selectedIndex = null;
                    document.getElementById('infoContent').style.display = 'none';
                    document.getElementById('placeholder').style.display = 'block';
                });
            }
        }
    };

    window.changeMonth = (v) => { currentDate.setMonth(currentDate.getMonth() + v); renderCalendar(); };
    document.getElementById('studentIdInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') checkStudentID(); });
</script>
</body>
</html>
