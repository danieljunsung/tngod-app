<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 공유 수행평가 달력</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { --bg-color: #f4f7f6; --card-bg: #ffffff; --primary-color: #4a90e2; --accent-color: #e74c3c; --success-color: #2ecc71; --warning-color: #f39c12; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-color); display: flex; justify-content: center; padding: 30px 20px; margin: 0; }
        
        .login-container { width: 100%; max-width: 400px; background: white; padding: 40px 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); text-align: center; margin-top: 50px; }
        .login-container h2 { margin-top: 0; color: #333; }
        .login-input { width: 100%; padding: 12px; margin: 20px 0; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1.2rem; text-align: center; letter-spacing: 3px; font-weight: bold; }
        .login-btn { width: 100%; padding: 12px; background: var(--primary-color); color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .login-btn:hover { background: #357abd; }

        .app-wrapper { width: 100%; max-width: 800px; display: none; flex-direction: column; gap: 20px; }
        .calendar-container, .action-panel { background: var(--card-bg); border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); padding: 30px; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px dashed #eee; gap: 10px; flex-wrap: wrap; }
        .selector-group { display: flex; gap: 10px; }
        .class-selector { font-size: 1.1rem; font-weight: bold; padding: 8px 12px; border-radius: 8px; border: 2px solid #ccc; background-color: #f9f9f9; color: #666; }
        
        .btn-reset { background: none; border: 1px solid #ccc; color: #999; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: 0.3s; }
        .btn-reset:hover { background: #fee; border-color: var(--accent-color); color: var(--accent-color); }

        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .calendar-header h1 { font-size: 1.6rem; color: #333; margin: 0; }
        .calendar-header button { background: var(--bg-color); border: none; font-size: 1.2rem; cursor: pointer; color: var(--primary-color); padding: 5px 15px; border-radius: 8px; }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .day-name { text-align: center; font-weight: bold; font-size: 0.9rem; color: #888; padding-bottom: 10px; }
        .day { background: #fff; border: 1px solid #eee; min-height: 100px; padding: 5px; border-radius: 8px; display: flex; flex-direction: column; cursor: pointer; position: relative; }
        .day.today { background: #eef5ff; border: 2px solid var(--primary-color); }
        .day-number { font-size: 1rem; font-weight: bold; color: #555; margin-bottom: 5px; }

        .event { background-color: var(--primary-color); color: white; border-radius: 4px; padding: 4px; margin-bottom: 3px; font-size: 0.8rem; font-weight: bold; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .event.selected { background-color: #2c3e50; transform: scale(1.05); }

        .action-panel { display: none; text-align: center; border: 2px solid var(--primary-color); }
        .action-buttons { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .action-buttons button { padding: 10px 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .rubric-modal { background: white; width: 90%; max-width: 600px; border-radius: 12px; padding: 20px; text-align: center; max-height: 90vh; overflow-y: auto; }
        
        .rubric-text-area { width: 100%; height: 120px; border: 1px solid #ddd; border-radius: 8px; padding: 10px; box-sizing: border-box; font-family: inherit; resize: none; margin-bottom: 15px; }
        
        .rubric-image-content { margin: 15px 0; border: 1px solid #eee; min-height: 50px; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
        .rubric-image-content img { max-width: 100%; height: auto; }
        
        #fileInput { display: none; }
        .btn-upload { background: #666; color: white; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 0.9rem; }
        .btn-save { background: var(--success-color); color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="login-container" id="loginScreen">
    <h2>👋 환영합니다!</h2>
    <p style="color:#666; font-size:0.95rem;">본인의 <strong>5자리 학번</strong>을 입력해 주세요.<br><span style="font-size:0.85rem; color:#999;">(예: 1학년 3반 12번 ➡️ 10312)</span></p>
    
    <input type="text" id="studentIdInput" class="login-input" placeholder="10312" maxlength="5">
    
    <button class="login-btn" onclick="checkStudentID()">달력 입장하기</button>
</div>

<div class="app-wrapper" id="mainApp">
    <div class="calendar-container">
        <div class="top-bar">
            <div class="selector-group">
                <select id="gradeSelect" class="class-selector" disabled>
                    <option value="1">1학년</option>
                    <option value="2">2학년</option>
                    <option value="3">3학년</option>
                </select>
                <select id="classSelect" class="class-selector" disabled></select>
            </div>
            
            <div style="display:flex; align-items:center; gap:15px;">
                <span id="syncStatus" style="color: var(--success-color); font-size: 0.8rem;">연결됨 ●</span>
                <button class="btn-reset" onclick="resetAllData()">전체 초기화</button>
            </div>
        </div>

        <div class="calendar-header">
            <button onclick="changeMonth(-1)">◀</button>
            <h1 id="monthYear">📅</h1>
            <button onclick="changeMonth(1)">▶</button>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <div class="action-panel" id="actionPanel">
        <h3 id="selectedEventTitle" style="margin-top:0;">일정 정보</h3>
        <div class="action-buttons">
            <button style="background:var(--success-color)" onclick="openRubricModal()">📂 열기</button>
            <button style="background:var(--primary-color)" onclick="editEvent()">✏️ 수정</button>
            <button style="background:var(--accent-color)" onclick="deleteEvent()">🗑️ 삭제</button>
            <button style="background:#95a5a6" onclick="closePanel()">닫기</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="rubric-modal">
        <h3 id="modalTitle">평가기준표 및 메모</h3>
        <textarea id="rubricText" class="rubric-text-area" placeholder="수행평가 기준이나 필요한 준비물 등 상세 내용을 적어보세요."></textarea>
        <div class="rubric-image-content" id="rubricImageContainer"></div>
        <div style="margin-top:15px; display:flex; justify-content:center; gap:10px; flex-wrap: wrap;">
            <button class="btn-save" onclick="saveRubricContent()">💾 저장하기</button>
            <label for="fileInput" class="btn-upload">📷 사진 선택</label>
            <input type="file" id="fileInput" accept="image/*" onchange="uploadPhoto(event)">
            <button onclick="closeRubricModal()" style="padding:10px 20px; border-radius:5px; border:1px solid #ccc; background: white;">닫기</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCHIC8vWvhsNSQdwxRPh56WTMGC89JuOXk",
        authDomain: "tngod-app.firebaseapp.com",
        databaseURL: "https://tngod-app-default-rtdb.firebaseio.com",
        projectId: "tngod-app",
        storageBucket: "tngod-app.firebasestorage.app",
        messagingSenderId: "986697110940",
        appId: "1:986697110940:web:038aeed8f8c3442f076459",
        measurementId: "G-ZVZJZF9EZ4"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentDate = new Date();
    let remoteEvents = {};
    let selectedDateKey = null, selectedIndex = null;
    let currentGrade = null; 
    let currentClass = null; 
    let dbListener = null;

    const classSelect = document.getElementById('classSelect');
    for (let i = 1; i <= 14; i++) {
        classSelect.innerHTML += `<option value="${i}">${i}반 캘린더</option>`;
    }

    // 🌟 오직 5자리만 허용하는 학번 분석 함수
    window.checkStudentID = () => {
        const inputId = document.getElementById('studentIdInput').value.trim();

        // 선생님용 마스터키
        if (inputId === "admin") {
            currentGrade = "1"; currentClass = "1";
            document.getElementById('gradeSelect').value = currentGrade;
            document.getElementById('classSelect').value = currentClass;
            document.getElementById('gradeSelect').disabled = false;
            document.getElementById('classSelect').disabled = false;
            enterCalendar();
            return;
        }

        // 숫자인지 확인하고, 정확히 5자리인지 검사
        if (/^\d{5}$/.test(inputId)) {
            
            // 맨 앞 1자리가 학년 (예: '1')
            currentGrade = inputId.substring(0, 1);
            
            // 다음 2자리가 반 (예: '03' -> 숫자 3으로 변환 후 다시 문자로)
            currentClass = parseInt(inputId.substring(1, 3), 10).toString();

            // 정상적인 학년(1~3)과 반(1~14) 범위인지 검사
            if (currentGrade >= 1 && currentGrade <= 3 && currentClass >= 1 && currentClass <= 14) {
                document.getElementById('gradeSelect').value = currentGrade;
                document.getElementById('classSelect').value = currentClass;
                enterCalendar();
            } else {
                alert("❌ 학년 또는 반 정보가 올바르지 않습니다. (예: 10312)");
            }
        } else {
            alert("❌ 학번은 정확히 숫자 5자리로 입력해 주세요! (예: 10312)");
        }
    };

    function enterCalendar() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'flex';
        listenToEvents();
    }

    document.getElementById('studentIdInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') checkStudentID();
    });

    document.getElementById('gradeSelect').addEventListener('change', function() { currentGrade = this.value; listenToEvents(); });
    document.getElementById('classSelect').addEventListener('change', function() { currentClass = this.value; listenToEvents(); });

    function listenToEvents() {
        if (dbListener) db.ref(dbListener).off();
        dbListener = `grade_${currentGrade}/class_${currentClass}/events`;
        document.getElementById('syncStatus').innerText = "불러오는 중...";
        
        db.ref(dbListener).on("value", (snapshot) => {
            remoteEvents = snapshot.val() || {};
            render();
            document.getElementById('syncStatus').innerText = "연결됨 ●";
            document.getElementById('syncStatus').style.color = "var(--success-color)";
        });
    }

    window.resetAllData = () => {
        if (confirm(`⚠️ 경고: [${currentGrade}학년 ${currentClass}반]의 모든 일정이 삭제됩니다. 계속하시겠습니까?`)) {
            if (confirm(`정말로 삭제하시겠습니까? 삭제된 데이터는 복구할 수 없습니다.`)) {
                db.ref(`grade_${currentGrade}/class_${currentClass}/events`).set(null).then(() => {
                    alert(`${currentGrade}학년 ${currentClass}반 달력이 초기화되었습니다.`);
                });
            }
        }
    };

    function syncToCloud() { db.ref(`grade_${currentGrade}/class_${currentClass}/events`).set(remoteEvents); }

    function render() {
        const year = currentDate.getFullYear(), month = currentDate.getMonth();
        document.getElementById('monthYear').innerText = `📅 ${year}년 ${month + 1}월`;
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = ['일','월','화','수','목','금','토'].map(d => `<div class="day-name">${d}</div>`).join('');

        const first = new Date(year, month, 1).getDay();
        const last = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < first; i++) grid.innerHTML += `<div class="day" style="border:none"></div>`;
        for (let i = 1; i <= last; i++) {
            const key = `${year}-${month}-${i}`;
            const isToday = (new Date().toDateString() === new Date(year, month, i).toDateString()) ? 'today' : '';
            const events = (remoteEvents[key] || []).map((ev, idx) => 
                `<div class="event" id="ev-${key}-${idx}" onclick="selectEv('${key}', ${idx}, '${ev.text}', event)">${ev.text}</div>`
            ).join('');
            grid.innerHTML += `<div class="day ${isToday}" onclick="addEv(${year}, ${month}, ${i})"><span class="day-number">${i}</span>${events}</div>`;
        }
    }

    window.addEv = (y, m, d) => {
        const txt = prompt('수행평가 내용을 입력하세요:');
        if (txt) {
            const key = `${y}-${m}-${d}`;
            if (!remoteEvents[key]) remoteEvents[key] = [];
            remoteEvents[key].push({ text: txt, rubric: null, rubricText: "" });
            syncToCloud();
        }
    };

    window.selectEv = (key, idx, txt, e) => {
        e.stopPropagation();
        selectedDateKey = key; selectedIndex = idx;
        document.querySelectorAll('.event').forEach(el => el.classList.remove('selected'));
        document.getElementById(`ev-${key}-${idx}`).classList.add('selected');
        document.getElementById('selectedEventTitle').innerText = txt;
        document.getElementById('actionPanel').style.display = 'block';
    };

    window.openRubricModal = () => {
        const ev = remoteEvents[selectedDateKey][selectedIndex];
        document.getElementById('modalTitle').innerText = `📄 ${ev.text} 상세 정보`;
        document.getElementById('rubricText').value = ev.rubricText || "";
        const imgContainer = document.getElementById('rubricImageContainer');
        imgContainer.innerHTML = ev.rubric ? `<img src="${ev.rubric}">` : `<p style="color:#bbb; padding: 20px;">등록된 이미지가 없습니다.</p>`;
        document.getElementById('modalOverlay').style.display = 'flex';
    };

    window.saveRubricContent = () => {
        remoteEvents[selectedDateKey][selectedIndex].rubricText = document.getElementById('rubricText').value;
        syncToCloud(); alert("상세 정보가 저장되었습니다!");
    };

    window.uploadPhoto = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
            remoteEvents[selectedDateKey][selectedIndex].rubric = ev.target.result;
            document.getElementById('rubricImageContainer').innerHTML = `<img src="${ev.target.result}">`;
        };
        if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
    };

    window.editEvent = () => {
        const newTxt = prompt('내용 수정:', remoteEvents[selectedDateKey][selectedIndex].text);
        if (newTxt) { remoteEvents[selectedDateKey][selectedIndex].text = newTxt; syncToCloud(); }
    };

    window.deleteEvent = () => {
        if(confirm('정말 삭제할까요?')) {
            remoteEvents[selectedDateKey].splice(selectedIndex, 1);
            syncToCloud(); closePanel();
        }
    };

    window.closePanel = () => { document.getElementById('actionPanel').style.display = 'none'; };
    window.closeRubricModal = () => document.getElementById('modalOverlay').style.display = 'none';
    window.changeMonth = (v) => { currentDate.setMonth(currentDate.getMonth() + v); render(); };
</script>
</body>
</html>
